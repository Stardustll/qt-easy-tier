name: Deepin build
description: deepin v25 容器内安装 DTK 依赖、配置、编译、测试与 QML 冒烟（供三个构建流水线复用；容器由调用方 job 提供）

inputs:
  build-dir:
    description: CMake 构建目录
    required: false
    default: build
  artifact-name:
    description: 上传产物名称；留空则不上传（release 流水线仅做验证）
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install build dependencies
      shell: bash
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          build-essential cmake ninja-build git pkg-config dpkg-dev \
          qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-tools-dev qt6-tools-dev-tools \
          libdtk6core-dev libdtk6gui-dev libdtk6declarative-dev \
          qml6-module-qtquick-controls2-styles-chameleon \
          libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
          libfontconfig1-dev libdbus-1-dev libfreetype6-dev \
          libx11-dev libxcb1-dev libxext-dev libxfixes-dev libxi-dev \
          libxrender-dev libxcb-glx0-dev libxcb-keysyms1-dev \
          libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev \
          libxcb-sync-dev libxcb-xfixes0-dev libxcb-shape0-dev \
          libxcb-randr0-dev libxcb-render-util0-dev libxcb-util-dev \
          libxcb-cursor-dev libxcb-xinerama0-dev libxcb-xkb-dev \
          libxcb-xinput-dev libegl1-mesa-dev libgles2-mesa-dev

    - name: Fix Qt runtime completeness
      shell: bash
      run: |
        # deepin 镜像预装的 Qt 6.8 配置文件齐全但部分运行时库被裁剪/版本错位，
        # 强制重装关键 Qt 运行时与 QML 模块包以恢复缺失的 .so（如 libQt6QuickDialogs2Utils.so.6.8.0）。
        # 注意：deepin 源中 libqt6quickdialogs2* 已合并进 qml6-module-qtquick-dialogs，勿单独安装。
        apt-get install -y --no-install-recommends --reinstall \
          libqt6core6 libqt6gui6 libqt6sql6 libqt6network6 libqt6widgets6 \
          libqt6qml6 libqt6quick6 libqt6quickcontrols2-6 libqt6quicktemplates2-6 \
          libqt6svg6 \
          qml6-module-qtquick qml6-module-qtquick-dialogs qml6-module-qtquick-controls \
          qml6-module-qtquick-templates
        apt-get install -y --fix-broken --no-install-recommends

    - name: Checkout
      uses: actions/checkout@v4

    - name: Show environment versions
      shell: bash
      run: |
        qmake6 -query QT_VERSION
        apt-cache policy libdtk6declarative-dev | head -5
        ls /usr/lib/x86_64-linux-gnu/libQt6QuickDialogs2* 2>/dev/null | head -5 || echo "QuickDialogs2 libs still missing"

    - name: Configure with DTK enabled
      shell: bash
      run: |
        cmake -S . -B "${{ inputs.build-dir }}" \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_WITH_DAEMON=OFF \
          -DQTET_ENABLE_DTK=ON

    - name: Build
      shell: bash
      run: cmake --build "${{ inputs.build-dir }}" -j

    - name: Run C++ tests
      shell: bash
      run: |
        QT_QPA_PLATFORM=offscreen ctest --test-dir "${{ inputs.build-dir }}" --output-on-failure

    - name: QML smoke test (offscreen, import org.deepin.dtk + Chameleon)
      shell: bash
      run: |
        set +e
        QT_QPA_PLATFORM=offscreen timeout 10 "${{ inputs.build-dir }}/Output/appQtEasyTier" --autostart > /tmp/qtet-smoke.log 2>&1
        code=$?
        set -e
        # 期望：timeout 杀进程退出码 124，且日志无 QML 模块加载失败
        if [ "$code" -ne 124 ]; then
          echo "app exited unexpectedly with code $code"
          cat /tmp/qtet-smoke.log
          exit 1
        fi
        if grep -iE "module .* not (found|installed)|TypeError|is not a (type|function)|Style '.*' not found" /tmp/qtet-smoke.log; then
          echo "QML module/type resolution failure detected"
          cat /tmp/qtet-smoke.log
          exit 1
        fi
        echo "smoke test passed (ran 10s without QML import errors)"

    - name: Upload artifacts
      if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.build-dir }}/Output/appQtEasyTier
