name: Linux build
description: 安装 Linux 构建依赖、配置、编译、测试，并可选打包 deb（供三个构建流水线复用）

inputs:
  build-dir:
    description: CMake 构建目录
    required: false
    default: build
  qt-version:
    description: Qt 版本
    required: false
    default: 6.8.3
  qt-arch:
    description: install-qt-action 架构（linux_gcc_64 / linux_gcc_arm64）
    required: true
  arch:
    description: 打包 deb 的架构（amd64/arm64）
    required: false
    default: ''
  version:
    description: 打包 deb 使用的版本号；为空则自动从 CMakeLists.txt 提取
    required: false
    default: ''
  package-deb:
    description: 是否打包 deb
    required: false
    type: boolean
    default: false
  artifact-prefix:
    description: 上传产物名前缀；留空则不上传
    required: false
    default: ''

outputs:
  version:
    description: 实际使用的版本号（input 或自动提取）
    value: ${{ steps.extract.outputs.version }}

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake ninja-build git bash dpkg-dev \
          libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
          libfontconfig1-dev libdbus-1-dev libfreetype6-dev \
          libx11-dev libxcb1-dev libxext-dev libxfixes-dev libxi-dev \
          libxrender-dev libxcb-glx0-dev libxcb-keysyms1-dev \
          libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev \
          libxcb-sync-dev libxcb-xfixes0-dev libxcb-shape0-dev \
          libxcb-randr0-dev libxcb-render-util0-dev libxcb-util-dev \
          libxcb-cursor-dev libxcb-xinerama0-dev libxcb-xkb-dev \
          libxcb-xinput-dev libegl1-mesa-dev libgles2-mesa-dev \
          libglu1-mesa-dev libpng-dev

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.qt-version }}
        target: desktop
        arch: ${{ inputs.qt-arch }}

    - name: Show Qt version
      shell: bash
      run: |
        qmake -query QT_VERSION
        qmake -query QT_INSTALL_PREFIX

    - name: Extract project version
      id: extract
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
        else
          VERSION="$(grep -E '^project\(QtEasyTier VERSION ' CMakeLists.txt | sed -E 's/.*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          if [ -z "$VERSION" ]; then
            echo "Failed to extract version from CMakeLists.txt" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        fi

    - name: Configure
      shell: bash
      run: |
        cmake -S . -B "${{ inputs.build-dir }}" \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$Qt6_DIR"

    - name: Build
      shell: bash
      run: |
        cmake --build "${{ inputs.build-dir }}" --parallel "$(nproc)"

    - name: Run tests
      shell: bash
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        ctest --test-dir "${{ inputs.build-dir }}" --output-on-failure

    - name: Build deb package
      if: ${{ inputs.package-deb }}
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.build-dir }}/Output
      run: |
        bash "${{ github.workspace }}/assets/package/linux/build_deb.sh" \
          -v "${{ steps.extract.outputs.version }}" \
          -a "${{ inputs.arch }}"

    - name: Compute artifact path
      id: artifact-path
      shell: bash
      run: |
        if [ "${{ inputs.package-deb }}" == "true" ]; then
          echo "path=${{ github.workspace }}/${{ inputs.build-dir }}/Output/qteasytier_v${{ steps.extract.outputs.version }}_linux_${{ inputs.arch }}.deb" >> "$GITHUB_OUTPUT"
        else
          echo "path=${{ github.workspace }}/${{ inputs.build-dir }}/Output" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload artifacts
      if: ${{ inputs.artifact-prefix != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-prefix }}-linux-${{ inputs.arch }}
        path: ${{ steps.artifact-path.outputs.path }}
        if-no-files-found: error
