name: Build And Test macOS
description: 在 macOS 上安装 Qt 与 Universal 静态 OpenSSL，配置、构建并运行测试。

inputs:
  build_dir:
    description: CMake 构建目录。
    required: false
    default: build
  qt_version:
    description: Qt 版本号。
    required: false
    default: 6.8.3
  extract_version:
    description: 是否从 CMakeLists.txt 提取项目版本号并作为 outputs.version 输出。
    required: false
    default: 'false'
  clone_daemon_from:
    description: 后端克隆来源（GITHUB / CNB）。
    required: false
    default: CNB

outputs:
  version:
    description: 从 CMakeLists.txt 提取的项目版本号。
    value: ${{ steps.version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Extract project version
      if: ${{ inputs.extract_version == 'true' }}
      id: version
      shell: bash
      run: |
        VERSION="$(grep -E '^project\(QtEasyTier VERSION ' CMakeLists.txt | sed -E 's/.*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
        if [ -z "$VERSION" ]; then
          echo "Failed to extract version from CMakeLists.txt"
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Install build tools
      shell: bash
      run: brew install ninja cmake boost

    # QtEasyTier 以静态方式链接 OpenSSL（OPENSSL_USE_STATIC_LIBS=TRUE）。
    # Homebrew 的 OpenSSL 为单架构，无法直接用于 Universal 构建，故此处
    # 分别编译 arm64 与 x86_64 静态库并用 lipo 合并为 Universal。
    # 注意：此步骤需在真实 runner 上验证；OpenSSL 版本可按需调整。
    - name: Build universal static OpenSSL
      shell: bash
      working-directory: ${{ runner.temp }}
      run: |
        set -euo pipefail
        OPENSSL_VER=3.5.7
        PREFIX="${RUNNER_TEMP}/openssl-universal"
        curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VER}/openssl-${OPENSSL_VER}.tar.gz" -o openssl.tar.gz
        tar xzf openssl.tar.gz
        cd "openssl-${OPENSSL_VER}"
        NPROC="$(sysctl -n hw.ncpu)"
        for ARCH in arm64 x86_64; do
          ./Configure "darwin64-${ARCH}-cc" no-shared no-tests \
            --prefix="${PREFIX}/${ARCH}" --openssldir="${PREFIX}/${ARCH}/ssl"
          make -j "${NPROC}"
          make install_sw
          make clean
        done
        mkdir -p "${PREFIX}/lib" "${PREFIX}/include"
        cp -R "${PREFIX}/arm64/include/." "${PREFIX}/include/"
        for LIB in libcrypto.a libssl.a; do
          lipo -create "${PREFIX}/arm64/lib/${LIB}" "${PREFIX}/x86_64/lib/${LIB}" \
            -output "${PREFIX}/lib/${LIB}"
        done
        lipo -info "${PREFIX}/lib/libcrypto.a"

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.qt_version }}
        target: desktop
        arch: clang_64

    - name: Show Qt version
      shell: bash
      run: |
        qmake -query QT_VERSION
        qmake -query QT_INSTALL_PREFIX

    - name: Configure
      shell: bash
      run: |
        cmake -S . -B "${{ inputs.build_dir }}" \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
          -DCMAKE_PREFIX_PATH="$Qt6_DIR;${{ runner.temp }}/openssl-universal" \
          -DOPENSSL_ROOT_DIR="${{ runner.temp }}/openssl-universal" \
          -DCLONE_DAEMON_FROM=${{ inputs.clone_daemon_from }}

    - name: Build
      shell: bash
      run: cmake --build "${{ inputs.build_dir }}" --parallel "$(sysctl -n hw.ncpu)"

    - name: Verify universal binaries
      shell: bash
      run: |
        APP="${{ inputs.build_dir }}/Output/appQtEasyTier.app"
        lipo -info "$APP/Contents/MacOS/appQtEasyTier"
        # daemon 与其依赖的 EasyTier FFI 动态库（经 @loader_path 加载）都须入包且为 Universal
        for BIN in qtet-daemon libeasytier_ffi.dylib; do
          if [ -f "$APP/Contents/MacOS/$BIN" ]; then
            lipo -info "$APP/Contents/MacOS/$BIN"
          else
            echo "::error::$BIN missing from app bundle Contents/MacOS"
            exit 1
          fi
        done

    - name: Run tests
      shell: bash
      env:
        QT_QPA_PLATFORM: offscreen
      run: ctest --test-dir "${{ inputs.build_dir }}" --output-on-failure
