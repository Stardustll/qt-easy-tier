name: build-release

on:
  push:
    branches:
      - 'v*'

permissions:
  contents: write
  issues: write

jobs:
  release-info:
    name: Resolve release info
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release-info.outputs.version }}
      release_tag: ${{ steps.release-info.outputs.release_tag }}
      release_title: ${{ steps.release-info.outputs.release_title }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from branch
        id: release-info
        shell: bash
        run: |
          set -euo pipefail

          BRANCH_NAME="${GITHUB_REF_NAME}"
          if [[ ! "$BRANCH_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Branch name must be a semantic version prefixed with v, got: $BRANCH_NAME" >&2
            exit 1
          fi

          VERSION="${BRANCH_NAME#v}"
          CMAKE_VERSION="$(grep -E '^project\(QtEasyTier VERSION ' CMakeLists.txt | sed -E 's/.*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"

          if [[ -z "$CMAKE_VERSION" ]]; then
            echo "Failed to read project version from CMakeLists.txt" >&2
            exit 1
          fi

          if [[ "$CMAKE_VERSION" != "$VERSION" ]]; then
            echo "Branch version ($VERSION) does not match CMakeLists.txt version ($CMAKE_VERSION)" >&2
            exit 1
          fi

          RELEASE_TAG="$VERSION"
          RELEASE_TITLE="QtEasyTier v${VERSION} (Desktop)"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

  linux-deb:
    name: Linux build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs:
      - release-info

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            qt_arch: linux_gcc_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            qt_arch: linux_gcc_arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux build
        uses: ./.github/actions/build/linux
        with:
          qt-arch: ${{ matrix.qt_arch }}
          arch: ${{ matrix.arch }}
          version: ${{ needs.release-info.outputs.version }}
          package-deb: true
          artifact-prefix: qteasytier-v${{ needs.release-info.outputs.version }}

  windows-zip:
    name: Windows build amd64
    runs-on: windows-2022
    needs:
      - release-info

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Windows build
        uses: ./.github/actions/build/windows
        with:
          version: ${{ needs.release-info.outputs.version }}
          package: true
          artifact-prefix: qteasytier-v${{ needs.release-info.outputs.version }}

  deepin-dtk:
    name: Deepin v25 DTK build
    runs-on: ubuntu-latest
    container:
      image: linuxdeepin/deepin:25
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deepin DTK build
        # 不传 artifact-name，仅做构建与冒烟验证，避免混入发布资产
        uses: ./.github/actions/build/deepin

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - release-info
      - linux-deb
      - windows-zip
    environment:
      name: qteasytier-release

    steps:
      - name: Wait for release approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: Approve QtEasyTier v${{ needs.release-info.outputs.version }} release
          issue-body: |
            QtEasyTier Desktop artifacts have been built and are ready to publish.

            Reply with `approved`, `approve`, `lgtm`, or `yes` to publish the Release.
            Reply with `denied`, `deny`, or `no` to stop the workflow.

            Version: `${{ needs.release-info.outputs.version }}`
            Release tag: `${{ needs.release-info.outputs.release_tag }}`
            Release title: `${{ needs.release-info.outputs.release_title }}`
            Branch: `${{ github.ref_name }}`
            Commit: `${{ github.sha }}`

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        run: |
          find release-assets -maxdepth 1 -type f -print | sort

      - name: List release assets
        run: |
          find release-assets -maxdepth 1 -type f -print | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-info.outputs.release_tag }}
          name: ${{ needs.release-info.outputs.release_title }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            QtEasyTier Desktop release.

            Release notes will be added manually after publishing.
          files: release-assets/*
