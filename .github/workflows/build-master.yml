name: build-master

on:
  push:
    branches:
      - master

jobs:
  linux-deb:
    name: Linux build
    # 提交信息以 docs 开头时跳过构建（仅文档变更，无需产物）
    if: ${{ !startsWith(github.event.head_commit.message, 'docs') }}
    uses: ./.github/workflows/linux.yml
    with:
      package-deb: true
      artifact-prefix: qteasytier-master

  windows-zip:
    name: Windows build amd64
    # 提交信息以 docs 开头时跳过构建（仅文档变更，无需产物）
    if: ${{ !startsWith(github.event.head_commit.message, 'docs') }}
    uses: ./.github/workflows/windows.yml
    with:
      package: true
      artifact-prefix: qteasytier-master

  deepin-dtk:
    name: Deepin v25 DTK build
    # 提交信息以 docs 开头时跳过构建（仅文档变更，无需产物）
    if: ${{ !startsWith(github.event.head_commit.message, 'docs') }}
    uses: ./.github/workflows/deepin.yml
    with:
      artifact-name: qteasytier-master-deepin
